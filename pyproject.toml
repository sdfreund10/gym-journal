[project]
name = "gym-journal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Steve Freund" }
]
requires-python = ">=3.9"
dependencies = [
    "django>=4.2.30",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16.1",
    "gunicorn>=23.0.0",
    "psycopg>=3.2.13",
    "python-dotenv>=1.0.1",
    "sentry-sdk>=2.69.1",
]

[project.scripts]
gym-journal = "gym_journal:manage"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
testpaths = ["src/gym_journal/tests"]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
