{% extends "gym_journal/base.html" %}

{% block title %}Workout — Exercise Tracker{% endblock %}

{% block content %}
<main class="mx-auto flex w-full max-w-md flex-1 flex-col px-5 pt-[calc(env(safe-area-inset-top,0px)+1.5rem)] text-center">
  {% url 'index' as home_url %}
  {% include "gym_journal/partials/page_nav.html" with back_url=home_url back_label="Home" %}
  <p class="text-muted-foreground">No active workout.</p>
  <form method="post" action="{% url 'start_workout' %}" class="mt-5">
    {% csrf_token %}
    <button type="submit" class="font-display rounded-2xl bg-primary px-8 py-5 text-xl uppercase text-primary-foreground active:scale-95 transition-transform">Start workout</button>
  </form>
</main>
{% endblock %}
