name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            uv sync
            uv run python manage.py migrate --settings=config.production
            uv run python manage.py collectstatic --noinput --settings=config.production
            RELEASE="$(git rev-parse HEAD)"
            if grep -q '^SENTRY_RELEASE=' .env; then
              sed -i "s/^SENTRY_RELEASE=.*/SENTRY_RELEASE=${RELEASE}/" .env
            else
              echo "SENTRY_RELEASE=${RELEASE}" >> .env
            fi
            sudo systemctl restart gym-journal
      - name: Smoke test health endpoint
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS "https://${HEALTH_CHECK_HOST}/health/" | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after deploy"
          exit 1
        env:
          HEALTH_CHECK_HOST: ${{ secrets.HEALTH_CHECK_HOST }}
